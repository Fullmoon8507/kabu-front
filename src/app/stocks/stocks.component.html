<mat-card>
  <mat-card-header class="card-header">
    <mat-card-title>銘柄マスタ</mat-card-title>
    <div class="header-right">
      <mat-form-field class="search-field" appearance="outline" subscriptSizing="dynamic">
        <mat-label>銘柄コード・銘柄名で検索</mat-label>
        <input matInput (input)="applyFilter($event)" placeholder="例：8267 / イオン" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="openAddDialog()">
        <mat-icon>add</mat-icon> 追加
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    @if (isLoading()) {
      <div class="loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource">

          <ng-container matColumnDef="ticker_code">
            <th mat-header-cell *matHeaderCellDef>銘柄コード</th>
            <td mat-cell *matCellDef="let row">{{ row.ticker_code }}</td>
          </ng-container>

          <ng-container matColumnDef="company_name">
            <th mat-header-cell *matHeaderCellDef>銘柄名</th>
            <td mat-cell *matCellDef="let row">{{ row.company_name }}</td>
          </ng-container>

          <ng-container matColumnDef="sector">
            <th mat-header-cell *matHeaderCellDef class="hide-sm">業種</th>
            <td mat-cell *matCellDef="let row" class="hide-sm">{{ row.sector ?? '—' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">該当する銘柄が見つかりません</td>
          </tr>
        </table>
      </div>
      <mat-paginator [pageSize]="50" [pageSizeOptions]="[20, 50, 100]" showFirstLastButtons />
    }
  </mat-card-content>
</mat-card>
